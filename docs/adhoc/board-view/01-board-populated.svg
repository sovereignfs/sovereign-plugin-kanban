<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1280" height="760" fill="#fafafa"/>

  <!-- Board header -->
  <text x="32" y="46" font-size="22" font-weight="700" fill="#18181b">Website relaunch</text>
  <!-- avatar stack -->
  <circle cx="980" cy="38" r="16" fill="#d4d4d8"/>
  <text x="980" y="43" font-size="12" text-anchor="middle" fill="#18181b">DU</text>
  <circle cx="1006" cy="38" r="16" fill="#c9cbd4"/>
  <text x="1006" y="43" font-size="12" text-anchor="middle" fill="#18181b">+2</text>
  <rect x="1044" y="22" width="92" height="34" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="1064" y="44" font-size="13" fill="#18181b">Settings</text>
  <line x1="0" y1="66" x2="1280" y2="66" stroke="#e4e4e7"/>

  <!-- Lists row -->
  <!-- List 1 -->
  <g>
    <rect x="24" y="88" width="264" height="600" rx="10" fill="#f4f4f5"/>
    <text x="40" y="112" font-size="14" font-weight="600" fill="#18181b">To Do</text>
    <text x="90" y="112" font-size="12" fill="#71717a">3</text>
    <text x="268" y="112" font-size="16" fill="#71717a">•••</text>

    <rect x="36" y="128" width="240" height="72" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="48" y="140" width="40" height="16" rx="8" fill="#e0c4c4"/>
    <text x="48" y="176" font-size="13" fill="#18181b">Sketch the board layout</text>

    <rect x="36" y="212" width="240" height="72" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="48" y="236" font-size="13" fill="#18181b">Write the data model</text>
    <text x="48" y="256" font-size="11" fill="#71717a">☑ 2/5   💬 1</text>

    <rect x="36" y="296" width="240" height="56" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="48" y="320" font-size="13" fill="#18181b">Pick label colors</text>
    <text x="48" y="336" font-size="11" fill="#71717a">📅 Aug 20</text>

    <!-- quick add -->
    <rect x="36" y="368" width="240" height="34" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-dasharray="4 3"/>
    <text x="48" y="390" font-size="13" fill="#a1a1aa">+ Add a card</text>
  </g>

  <!-- List 2 -->
  <g>
    <rect x="304" y="88" width="264" height="600" rx="10" fill="#f4f4f5"/>
    <text x="320" y="112" font-size="14" font-weight="600" fill="#18181b">In Progress</text>
    <text x="404" y="112" font-size="12" fill="#71717a">1</text>
    <text x="548" y="112" font-size="16" fill="#71717a">•••</text>

    <rect x="316" y="128" width="240" height="56" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="328" y="152" font-size="13" fill="#18181b">Wire up drag-and-drop</text>
    <text x="328" y="168" font-size="11" fill="#71717a">📅 Aug 22</text>

    <rect x="316" y="196" width="240" height="34" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-dasharray="4 3"/>
    <text x="328" y="218" font-size="13" fill="#a1a1aa">+ Add a card</text>
  </g>

  <!-- List 3 -->
  <g>
    <rect x="584" y="88" width="264" height="600" rx="10" fill="#f4f4f5"/>
    <text x="600" y="112" font-size="14" font-weight="600" fill="#18181b">Done</text>
    <text x="656" y="112" font-size="12" fill="#71717a">1</text>
    <text x="828" y="112" font-size="16" fill="#71717a">•••</text>

    <rect x="596" y="128" width="240" height="56" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="608" y="152" font-size="13" fill="#18181b">Decide on the plugin name</text>

    <rect x="596" y="196" width="240" height="34" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-dasharray="4 3"/>
    <text x="608" y="218" font-size="13" fill="#a1a1aa">+ Add a card</text>
  </g>

  <!-- Add list -->
  <g>
    <rect x="864" y="88" width="220" height="48" rx="10" fill="none" stroke="#d4d4d8" stroke-dasharray="6 4"/>
    <text x="884" y="118" font-size="14" fill="#52525b">＋ Add list</text>
  </g>

  <text x="24" y="720" font-size="12" fill="#a1a1aa">Lists scroll horizontally as a group; each list's cards scroll independently within it.</text>
  <text x="24" y="738" font-size="12" fill="#a1a1aa">Card tile shows: labels row, title, then a metadata row (checklist, comments, due date) only when present.</text>
</svg>
