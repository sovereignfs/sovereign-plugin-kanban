<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="640" height="460" fill="#e4e4e7" opacity="0.6"/>
  <rect x="120" y="50" width="400" height="360" rx="12" fill="#ffffff" stroke="#d4d4d8"/>

  <text x="148" y="92" font-size="18" font-weight="700" fill="#18181b">New board</text>
  <text x="148" y="112" font-size="13" fill="#71717a">in Marketing</text>
  <text x="496" y="90" font-size="16" fill="#71717a">✕</text>

  <text x="148" y="150" font-size="13" font-weight="600" fill="#18181b">Name</text>
  <rect x="148" y="160" width="344" height="38" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="162" y="184" font-size="14" fill="#a1a1aa">e.g. Website relaunch</text>

  <text x="148" y="234" font-size="13" font-weight="600" fill="#18181b">Color</text>
  <!-- 8 swatches, first selected -->
  <rect x="148" y="246" width="36" height="36" rx="8" fill="#b5c9e8" stroke="#18181b" stroke-width="2"/>
  <rect x="192" y="246" width="36" height="36" rx="8" fill="#c9e0c4"/>
  <rect x="236" y="246" width="36" height="36" rx="8" fill="#e8d3b5"/>
  <rect x="280" y="246" width="36" height="36" rx="8" fill="#e0c4c4"/>
  <rect x="324" y="246" width="36" height="36" rx="8" fill="#d8c4e0"/>
  <rect x="368" y="246" width="36" height="36" rx="8" fill="#c4dde0"/>
  <rect x="412" y="246" width="36" height="36" rx="8" fill="#d6d3cb"/>
  <rect x="456" y="246" width="36" height="36" rx="8" fill="#c9cbd4"/>
  <text x="148" y="304" font-size="11" fill="#a1a1aa">Muted palette; selection ring uses the accent token. Default: first swatch.</text>

  <rect x="316" y="330" width="80" height="34" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="336" y="352" font-size="13" fill="#18181b">Cancel</text>
  <rect x="404" y="330" width="108" height="34" rx="8" fill="#18181b"/>
  <text x="420" y="352" font-size="13" fill="#ffffff">Create board</text>
