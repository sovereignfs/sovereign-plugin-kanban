<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="560" fill="#fafafa"/>

  <!-- Secondary sidebar -->
  <rect x="0" y="0" width="220" height="560" fill="#f4f4f5"/>
  <line x1="220" y1="0" x2="220" y2="560" stroke="#e4e4e7"/>
  <rect x="12" y="16" width="196" height="36" rx="8" fill="#e4e4e7"/>
  <text x="28" y="39" font-size="14" font-weight="600" fill="#18181b">Boards</text>
  <text x="28" y="79" font-size="14" fill="#52525b">Inbox</text>

  <!-- Page header -->
  <text x="252" y="52" font-size="24" font-weight="700" fill="#18181b">Boards</text>

  <!-- Empty state -->
  <rect x="410" y="160" width="380" height="240" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <rect x="560" y="192" width="80" height="52" rx="8" fill="#f4f4f5"/>
  <rect x="572" y="200" width="14" height="28" rx="3" fill="#d4d4d8"/>
  <rect x="592" y="200" width="14" height="18" rx="3" fill="#d4d4d8"/>
  <rect x="612" y="200" width="14" height="34" rx="3" fill="#d4d4d8"/>
  <text x="600" y="284" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle">Create your first project</text>
  <text x="600" y="308" font-size="13" fill="#71717a" text-anchor="middle">Projects group your boards — one per team,</text>
  <text x="600" y="326" font-size="13" fill="#71717a" text-anchor="middle">client, or area of life.</text>
  <rect x="540" y="344" width="120" height="34" rx="8" fill="#18181b"/>
  <text x="562" y="366" font-size="13" fill="#ffffff">New project</text>

  <text x="600" y="440" font-size="12" fill="#a1a1aa" text-anchor="middle">Boards shared with you appear here automatically — no setup needed.</text>
</svg>
