<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="640" height="440" fill="#e4e4e7" opacity="0.6"/>
  <rect x="120" y="60" width="400" height="320" rx="12" fill="#ffffff" stroke="#d4d4d8"/>

  <text x="148" y="102" font-size="18" font-weight="700" fill="#18181b">New project</text>
  <text x="496" y="100" font-size="16" fill="#71717a">✕</text>

  <text x="148" y="140" font-size="13" font-weight="600" fill="#18181b">Name</text>
  <rect x="148" y="150" width="344" height="38" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="162" y="174" font-size="14" fill="#a1a1aa">e.g. Marketing</text>

  <text x="148" y="220" font-size="13" font-weight="600" fill="#18181b">Description <tspan fill="#a1a1aa" font-weight="400">(optional)</tspan></text>
  <rect x="148" y="230" width="344" height="64" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="162" y="254" font-size="14" fill="#a1a1aa">What is this project for?</text>

  <!-- Inline error slot (expected failures render here, input intact) -->
  <text x="148" y="316" font-size="12" fill="#b91c1c">Project name is required.</text>

  <rect x="316" y="330" width="80" height="34" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="336" y="352" font-size="13" fill="#18181b">Cancel</text>
  <rect x="404" y="330" width="112" height="34" rx="8" fill="#18181b"/>
  <text x="420" y="352" font-size="13" fill="#ffffff">Create project</text>
  <text x="148" y="404" font-size="11" fill="#a1a1aa">Pending: button label flips to "Creating…" and the form disables.</text>
</svg>
